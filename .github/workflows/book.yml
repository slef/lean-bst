name: Book
on:
  push:
    branches: [main]
    paths: ['RotationBST.lean', 'RotationBST/**', 'book/**', 'lean-toolchain', 'lake-manifest.json', '.github/workflows/book.yml']
  pull_request:
    paths: ['RotationBST.lean', 'RotationBST/**', 'book/**', 'lean-toolchain', 'lake-manifest.json', '.github/workflows/book.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the library; the book reads the resulting .ilean files.
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: book/package-lock.json
      - name: Build the book
        working-directory: book
        run: |
          npm ci
          npm run extract
          npm run build
          npm run lint
          npm test
          npm run check:pages -- --require
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
