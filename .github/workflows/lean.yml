name: Lean
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check library import coverage
        run: python3 scripts/check_imports.py
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
      - name: Check extracted documentation snippets
        run: |
          python3 docs/extract_snippets.py
          git diff --exit-code -- docs/lean-snippets
